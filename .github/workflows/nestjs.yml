name: nestjs

on:
  push:
    branches: [main]
    paths:
      - 'implementations/nestjs/**'
      - 'skills/nestjs-architecture-harness/**'
      - '.github/workflows/nestjs.yml'
  pull_request:
    paths:
      - 'implementations/nestjs/**'
      - 'skills/nestjs-architecture-harness/**'
      - '.github/workflows/nestjs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  nestjs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/nestjs/examples
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - run: cd ../harness && npm ci && npm run lint && npm run typecheck && npm run test:evaluators && npm run test:meta && npm run test:profile
      - name: Harness
        run: cd ../harness && npm run evaluate -- ../examples | tee /tmp/harness-output.txt
      - name: Agent skill bundle matches the harness source
        run: cd ../harness && npm run build:skill && git diff --exit-code -- ../../../skills/nestjs-architecture-harness
      - name: Agent skill scores the examples
        run: |
          bash ../../../skills/nestjs-architecture-harness/scripts/run.sh . --profile=benchmark --out=/tmp/skill-report.json
          node -e "const r = require('/tmp/skill-report.json'); if (r.grade !== 'A') { console.error(r); process.exit(1) }"

      - name: Format harness score comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          { echo '### nestjs harness'; echo; echo '```'; cat /tmp/harness-output.txt; echo '```'; } > /tmp/harness-comment.md

      - name: Comment harness score on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: harness-nestjs
          path: /tmp/harness-comment.md
